name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: unzip and build
        run: |
          mkdir work
          unzip -q girlfriendmod.zip -d work
          cd work
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: mod-jar
          path: |
            work/build/libs/*.jar
            !work/build/libs/*-sources.jar
